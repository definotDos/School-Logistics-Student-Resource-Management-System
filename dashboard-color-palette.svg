<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc"><title id="title">School logistics dashboard palette</title><desc id="desc">Forest green surfaces with gold, blue, sage and lavender workflow accents.</desc><rect width="1120" height="650" rx="20" fill="#101F19"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="55" fill="#F0F4E6" font-size="27" font-weight="700">School logistics ? Forest palette</text><text x="40" y="87" fill="#BDCDB9" font-size="16">Layered green backgrounds with consistent workflow colors</text><g><rect x="40" y="125" width="192" height="112" rx="12" fill="#101F19" stroke="#365244"/><text x="40" y="267" fill="#F0F4E6" font-size="16" font-weight="600">Canvas</text><text x="40" y="293" fill="#BDCDB9" font-size="14">#101F19</text><text x="40" y="318" fill="#BDCDB9" font-size="12">Page background</text></g><g><rect x="252" y="125" width="192" height="112" rx="12" fill="#192F25" stroke="#365244"/><text x="252" y="267" fill="#F0F4E6" font-size="16" font-weight="600">Surface</text><text x="252" y="293" fill="#BDCDB9" font-size="14">#192F25</text><text x="252" y="318" fill="#BDCDB9" font-size="12">Panels and cards</text></g><g><rect x="464" y="125" width="192" height="112" rx="12" fill="#223B2E" stroke="#365244"/><text x="464" y="267" fill="#F0F4E6" font-size="16" font-weight="600">Raised surface</text><text x="464" y="293" fill="#BDCDB9" font-size="14">#223B2E</text><text x="464" y="318" fill="#BDCDB9" font-size="12">Headers and icon tiles</text></g><g><rect x="676" y="125" width="192" height="112" rx="12" fill="#365244" stroke="#365244"/><text x="676" y="267" fill="#F0F4E6" font-size="16" font-weight="600">Border</text><text x="676" y="293" fill="#BDCDB9" font-size="14">#365244</text><text x="676" y="318" fill="#BDCDB9" font-size="12">Panel separators</text></g><g><rect x="888" y="125" width="192" height="112" rx="12" fill="#F0F4E6" stroke="#365244"/><text x="888" y="267" fill="#F0F4E6" font-size="16" font-weight="600">Primary text</text><text x="888" y="293" fill="#BDCDB9" font-size="14">#F0F4E6</text><text x="888" y="318" fill="#BDCDB9" font-size="12">Headings and values</text></g><g><rect x="40" y="360" width="192" height="112" rx="12" fill="#BDCDB9" stroke="#365244"/><text x="40" y="502" fill="#F0F4E6" font-size="16" font-weight="600">Muted text</text><text x="40" y="528" fill="#BDCDB9" font-size="14">#BDCDB9</text><text x="40" y="553" fill="#BDCDB9" font-size="12">Descriptions and labels</text></g><g><rect x="252" y="360" width="192" height="112" rx="12" fill="#E4C772" stroke="#365244"/><text x="252" y="502" fill="#F0F4E6" font-size="16" font-weight="600">Gold</text><text x="252" y="528" fill="#BDCDB9" font-size="14">#E4C772</text><text x="252" y="553" fill="#BDCDB9" font-size="12">Requests and reviews</text></g><g><rect x="464" y="360" width="192" height="112" rx="12" fill="#93C8DF" stroke="#365244"/><text x="464" y="502" fill="#F0F4E6" font-size="16" font-weight="600">Blue</text><text x="464" y="528" fill="#BDCDB9" font-size="14">#93C8DF</text><text x="464" y="553" fill="#BDCDB9" font-size="12">Resources and inventory</text></g><g><rect x="676" y="360" width="192" height="112" rx="12" fill="#A9D7AF" stroke="#365244"/><text x="676" y="502" fill="#F0F4E6" font-size="16" font-weight="600">Sage</text><text x="676" y="528" fill="#BDCDB9" font-size="14">#A9D7AF</text><text x="676" y="553" fill="#BDCDB9" font-size="12">Users and analytics</text></g><g><rect x="888" y="360" width="192" height="112" rx="12" fill="#C6AFE2" stroke="#365244"/><text x="888" y="502" fill="#F0F4E6" font-size="16" font-weight="600">Lavender</text><text x="888" y="528" fill="#BDCDB9" font-size="14">#C6AFE2</text><text x="888" y="553" fill="#BDCDB9" font-size="12">Schedules and claims</text></g></g></svg>